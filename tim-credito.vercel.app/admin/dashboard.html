<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Comprovantes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0b1120; color: #f1f5f9; min-height: 100vh; }
        .navbar { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
        .tim-badge { background: #FF192D; color: white; font-weight: 900; font-size: 16px; padding: 4px 10px; border-radius: 6px; }
        .nav-actions { display: flex; gap: 10px; }
        .btn-action-nav { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-action-nav:hover { color: #fff; background: #334155; }
        .btn-logout { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .btn-logout:hover { background: #ef4444; color: white; }
        .container { max-width: 1360px; margin: 0 auto; padding: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 18px; }
        .stat-card h4 { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
        .stat-value { font-size: 26px; font-weight: 800; color: #fff; }
        .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 240px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: white; outline: none; }
        .filter-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .table-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { background: #131d35; color: #94a3b8; font-size: 11px; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid #1e293b; }
        td { padding: 14px 16px; border-bottom: 1px solid #1e293b; vertical-align: middle; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .badge-confirmed { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .type-tag { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #1e293b; color: #93c5fd; }
        .btn-view { background: #1e293b; color: #60a5fa; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .btn-approve { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .btn-reject { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .btn-del { background: transparent; color: #64748b; border: none; cursor: pointer; padding: 6px; }
        .btn-del:hover { color: #f87171; }
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: #0f172a; border: 1px solid #334155; border-radius: 14px; max-width: 650px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 14px 18px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 18px; overflow-y: auto; text-align: center; }
        .modal-body img { max-width: 100%; max-height: 60vh; border-radius: 8px; }
        .modal-footer { padding: 12px 18px; border-top: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <header class="navbar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="tim-badge">TIM</span>
            <span style="font-weight: 800; font-size: 17px;">Painel Admin - Comprovantes</span>
        </div>
        <div class="nav-actions">
            <button class="btn-action-nav" onclick="loadComprovantes()">Atualizar</button>
            <button class="btn-action-nav btn-logout" onclick="handleLogout()">Sair</button>
        </div>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><h4>Total</h4><div class="stat-value" id="statTotal">0</div></div>
            <div class="stat-card"><h4>Pendentes</h4><div class="stat-value" id="statPending" style="color:#fbbf24;">0</div></div>
            <div class="stat-card"><h4>Confirmados</h4><div class="stat-value" id="statConfirmed" style="color:#34d399;">0</div></div>
            <div class="stat-card"><h4>Recusados</h4><div class="stat-value" id="statRejected" style="color:#f87171;">0</div></div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por telefone ou transação..." oninput="filterData()">
            <button class="filter-btn active" onclick="setFilter('all', this)">Todos</button>
            <button class="filter-btn" onclick="setFilter('pending', this)">Pendentes</button>
            <button class="filter-btn" onclick="setFilter('confirmed', this)">Confirmados</button>
            <button class="filter-btn" onclick="setFilter('rejected', this)">Recusados</button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Data & Hora</th>
                        <th>Lead / Telefone</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>TRANSAÇÃO</th>
                        <th>Comprovante</th>
                        <th>Status</th>
                        <th style="text-align: right;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" style="text-align: center; padding: 30px; color: #64748b;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Preview -->
    <div class="modal-overlay" id="previewModal" onclick="if (event.target.id === 'previewModal') closeModal()">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modalTitle" style="font-weight: 700;">Comprovante</span>
                <button onclick="closeModal()" style="background:none;border:none;color:white;font-size:18px;cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <span id="modalMeta" style="font-size: 11px; color: #94a3b8;"></span>
                <a id="modalDownload" href="#" target="_blank" class="btn-view" download>Abrir em nova aba</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const token = localStorage.getItem('tim_admin_token');
        if (!token) window.location.href = '/admin';

        let allRecords = [];
        let currentFilter = 'all';

        async function loadComprovantes() {
            try {
                const res = await fetch('/api/admin/comprovantes', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) {
                    localStorage.removeItem('tim_admin_token');
                    window.location.href = '/admin';
                    return;
                }
                const result = await res.json();
                if (result.success) {
                    allRecords = result.data || [];
                    updateStats();
                    filterData();
                }
            } catch(e) {}
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allRecords.length;
            document.getElementById('statPending').textContent = allRecords.filter(r => r.status === 'pending').length;
            document.getElementById('statConfirmed').textContent = allRecords.filter(r => r.status === 'confirmed').length;
            document.getElementById('statRejected').textContent = allRecords.filter(r => r.status === 'rejected').length;
        }

        function setFilter(f, btn) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterData();
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allRecords.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.status === currentFilter;
                const matchesSearch = !search ||
                    (item.phone && item.phone.toLowerCase().includes(search)) ||
                    (item.transactionId && item.transactionId.toLowerCase().includes(search));
                return matchesFilter && matchesSearch;
            });
            renderTable(filtered);
        }

        function renderTable(records) {
            const tbody = document.getElementById('tableBody');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:#64748b;">Nenhum comprovante encontrado.</td></tr>';
                return;
            }

            tbody.innerHTML = records.map(c => {
                const dateStr = c.uploadTime ? new Date(c.uploadTime).toLocaleString('pt-BR') : '-';
                const fileUrl = `/api/admin/comprovantes/${c.id}/file?token=${token}`;
                let statusBadge = '<span class="badge badge-pending">Pendente</span>';
                if (c.status === 'confirmed') statusBadge = '<span class="badge badge-confirmed">Aprovado</span>';
                if (c.status === 'rejected') statusBadge = '<span class="badge badge-rejected">Recusado</span>';

                return `
                    <tr>
                        <td style="color:#94a3b8; font-size:12px;">${dateStr}</td>
                        <td style="font-weight:700;">${c.phone || '-'}</td>
                        <td><span class="type-tag">${c.type === 'taxa' ? '🛡️ Taxa R$13,90' : '📱 Recarga'}</span></td>
                        <td style="font-weight:700;">R$ ${c.value || '-'}</td>
                        <td>
                            <code style="background:#1e293b; padding:4px 8px; border-radius:6px; font-size:12px; color:#93c5fd; font-family:monospace; user-select:all; word-break:break-all; display:inline-block; cursor:pointer;" title="Clique para copiar" onclick="if ('${c.transactionId || ''}') { navigator.clipboard.writeText('${c.transactionId || ''}'); showToast('ID copiado!'); }">
                                ${c.transactionId || '-'}
                            </code>
                        </td>
                        <td>
                            <button class="btn-view" onclick="openPreview('${c.id}', '${encodeURIComponent(c.originalName || 'comprovante')}', '${c.mimeType}', '${c.uploadTime}', '${c.transactionId || ''}')">Ver Arquivo</button>
                        </td>
                        <td>${statusBadge}</td>
                        <td style="text-align:right;">
                            <div style="display:inline-flex; gap:6px;">
                                ${c.status !== 'confirmed' ? `<button class="btn-approve" onclick="updateStatus('${c.id}', 'confirmed')">Aprovar</button>` : ''}
                                ${c.status !== 'rejected' ? `<button class="btn-reject" onclick="updateStatus('${c.id}', 'rejected')">Recusar</button>` : ''}
                                <button class="btn-del" onclick="deleteRecord('${c.id}')" title="Excluir">✕</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function updateStatus(id, newStatus) {
            const res = await fetch(`/api/admin/comprovantes/${id}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status: newStatus })
            });
            const data = await res.json();
            if (data.success) {
                showToast(newStatus === 'confirmed' ? 'Aprovado!' : 'Recusado!');
                loadComprovantes();
            }
        }

        async function deleteRecord(id) {
            if (!confirm('Excluir este comprovante?')) return;
            const res = await fetch(`/api/admin/comprovantes/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) { showToast('Excluído'); loadComprovantes(); }
        }

        function openPreview(id, name, mime, time, txId) {
            const fileUrl = `/api/admin/comprovantes/${id}/file?token=${token}`;
            document.getElementById('modalTitle').textContent = decodeURIComponent(name);
            document.getElementById('modalMeta').textContent = (txId ? `Transação: ${txId} • ` : '') + (time ? new Date(time).toLocaleString('pt-BR') : '');
            document.getElementById('modalDownload').href = fileUrl;
            document.getElementById('modalBody').innerHTML = mime === 'application/pdf' 
                ? `<p style="padding:20px;">Documento PDF. <a href="${fileUrl}" target="_blank" class="btn-view">Abrir PDF</a></p>`
                : `<img src="${fileUrl}" style="max-width:100%;max-height:60vh;border-radius:6px;">`;
            document.getElementById('previewModal').classList.add('open');
        }

        function closeModal() { document.getElementById('previewModal').classList.remove('open'); }
        function handleLogout() {
            localStorage.removeItem('tim_admin_token');
            window.location.href = '/admin';
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        loadComprovantes();
        setInterval(loadComprovantes, 15000);
    </script>
</body>
</html>
